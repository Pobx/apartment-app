version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: apartment_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: apartment_db
      MYSQL_USER: apartment_user
      MYSQL_PASSWORD: apartment_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - apartment_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Keycloak Authorization Server
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: apartment_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - apartment_network
    depends_on:
      - mysql

  # Golang Echo Backend API (Hexagonal Architecture)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: apartment_backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_DSN: "apartment_user:apartment_pass@tcp(mysql:3306)/apartment_db?charset=utf8mb4&parseTime=True&loc=Local"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "apartment-realm"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - apartment_network

  # React 18 + Vite + Tailwind CSS Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: apartment_frontend
    restart: unless-stopped
    networks:
      - apartment_network

  # Nginx Upstream Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: apartment_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - apartment_network

networks:
  apartment_network:
    driver: bridge

volumes:
  mysql_data:
